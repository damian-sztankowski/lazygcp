name: CD — Semantic Release, Multi-Arch Binaries & Release Notes

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump strategy (auto, patch, minor, major, or exact vX.Y.Z)'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: 1. Pre-Release Checks & Semantic Version Calculation
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.semver.outputs.should_release }}
      release_tag: ${{ steps.semver.outputs.release_tag }}
      prev_tag: ${{ steps.semver.outputs.prev_tag }}
    steps:
      - name: Checkout Repository with Full History & Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Pre-Release Quality Gate (Vet, Unit Tests & 5-Target Build)
        run: |
          make test
          make release-check

      - name: Calculate Next Semantic Version from Conventional Commits
        id: semver
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          git fetch --tags --force

          # If triggered directly by a v* tag push, release that exact tag
          if [ "$REF_TYPE" = "tag" ] && echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${REF_NAME}$" | head -n 1 || echo "")
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
            echo "Triggered by tag push: $REF_NAME (previous: ${PREV_TAG:-none})"
            exit 0
          fi

          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || echo "v0.1.0")
          echo "prev_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          # Check if HEAD is already tagged with LAST_TAG and not manually triggered
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || echo "")
          if [ "$HEAD_SHA" = "$TAG_SHA" ] && [ -z "$INPUT_BUMP" ]; then
            echo "HEAD is already tagged at $LAST_TAG. Skipping duplicate release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VER="${LAST_TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          if [ -n "$TAG_SHA" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s" || echo "")
          fi

          BUMP="${INPUT_BUMP:-auto}"
          if [ "$BUMP" = "auto" ]; then
            if echo "$COMMITS" | grep -Eq '^(feat|fix|perf|refactor)(\([a-zA-Z0-9_-]+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -Eq '^feat(\([a-zA-Z0-9_-]+\))?:'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -Eq '^(fix|perf|refactor|docs|build|ci)(\([a-zA-Z0-9_-]+\))?:'; then
              BUMP="patch"
            else
              echo "No releasable Conventional Commits found since $LAST_TAG."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              ;;
            patch)
              PATCH=$((PATCH + 1))
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              ;;
            v*)
              NEXT_TAG="$BUMP"
              ;;
            *)
              NEXT_TAG="v${BUMP}"
              ;;
          esac

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Calculated next release version: $NEXT_TAG (from $LAST_TAG)"

  publish-release:
    name: 2. Approve, Build Multi-Arch Binaries & Publish Release Notes
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Multi-OS & Multi-Arch Release Archives + SHA-256 Checksums
        env:
          TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          VER="${TAG#v}"
          mkdir -p dist

          build_archive() {
            GOOS_VAL=$1
            GOARCH_VAL=$2
            EXT=$3
            STAGE_DIR="dist/stage_${GOOS_VAL}_${GOARCH_VAL}"
            mkdir -p "$STAGE_DIR"

            BIN="lazygcp"
            if [ "$GOOS_VAL" = "windows" ]; then
              BIN="lazygcp.exe"
            fi

            echo "Building lazygcp ${TAG} for ${GOOS_VAL}/${GOARCH_VAL}..."
            CGO_ENABLED=0 GOOS="$GOOS_VAL" GOARCH="$GOARCH_VAL" \
              go build -trimpath -ldflags="-s -w -X main.version=${VER}" -o "${STAGE_DIR}/${BIN}" .

            cp README.md LICENSE NOTICE "${STAGE_DIR}/"

            if [ "$EXT" = "zip" ]; then
              (cd "$STAGE_DIR" && zip -q "../lazygcp_${VER}_${GOOS_VAL}_${GOARCH_VAL}.zip" "$BIN" README.md LICENSE NOTICE)
            else
              tar -C "$STAGE_DIR" -czf "dist/lazygcp_${VER}_${GOOS_VAL}_${GOARCH_VAL}.tar.gz" "$BIN" README.md LICENSE NOTICE
            fi
            rm -rf "$STAGE_DIR"
          }

          build_archive darwin arm64 tar.gz
          build_archive darwin amd64 tar.gz
          build_archive linux amd64 tar.gz
          build_archive linux arm64 tar.gz
          build_archive windows amd64 zip

          (cd dist && sha256sum lazygcp_* > checksums.txt)
          ls -lh dist/

      - name: Generate Categorized Release Notes
        env:
          TAG: ${{ needs.prepare-release.outputs.release_tag }}
          PREV_TAG: ${{ needs.prepare-release.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          RANGE=""
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            HEAD_SHA=$(git rev-parse HEAD)
            PREV_SHA=$(git rev-list -n 1 "$PREV_TAG")
            if [ "$HEAD_SHA" != "$PREV_SHA" ]; then
              RANGE="${PREV_TAG}..HEAD"
            fi
          fi

          if [ -n "$RANGE" ]; then
            FEATS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" || true)
            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" --grep="^perf" || true)
            DOCS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^docs" || true)
            OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^perf" --grep="^docs" || true)
          else
            FEATS=$(git log -n 10 --pretty=format:"- %s (%h)" --grep="^feat" || true)
            FIXES=$(git log -n 10 --pretty=format:"- %s (%h)" --grep="^fix" || true)
            DOCS=$(git log -n 10 --pretty=format:"- %s (%h)" --grep="^docs" || true)
            OTHER=""
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          ## ⚡ lazygcp ${TAG}

          > **\`lazygcp\` — it's a lazy way to deal with Google Cloud Platform.**

          ### 🚀 1-Line Quick Install (macOS & Linux)
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${REPO}/main/install.sh | sh
          \`\`\`

          ### 📦 Install via Go
          \`\`\`bash
          go install github.com/${REPO}@${TAG}
          \`\`\`

          ---
          EOF

          if [ -n "$FEATS" ]; then
            printf "\n### ✨ New Features & Enhancements\n%s\n" "$FEATS" >> dist/RELEASE_NOTES.md
          fi
          if [ -n "$FIXES" ]; then
            printf "\n### 🐛 Bug Fixes & Performance\n%s\n" "$FIXES" >> dist/RELEASE_NOTES.md
          fi
          if [ -n "$DOCS" ]; then
            printf "\n### 📖 Documentation\n%s\n" "$DOCS" >> dist/RELEASE_NOTES.md
          fi
          if [ -n "$OTHER" ]; then
            printf "\n### ⚙️ CI/CD & Maintenance\n%s\n" "$OTHER" >> dist/RELEASE_NOTES.md
          fi

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            printf "\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n" "$REPO" "$PREV_TAG" "$TAG" >> dist/RELEASE_NOTES.md
          fi

          cat dist/RELEASE_NOTES.md

      - name: Create Tag & Publish GitHub Release with Binaries and Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: "⚡ lazygcp ${{ needs.prepare-release.outputs.release_tag }}"
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/lazygcp_*
            dist/checksums.txt
